<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Login / Sign Up - FlyTripVisa</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root { --primary:#e11d2c; --primary-light:#ff4d5a; --gold:#f5b042; --bg:#000; --card-bg:#141414; --text:#f0f0f0; --muted:#8a9ab8; --border:#2a2a2a; }
body { font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--text); max-width:500px; margin:0 auto; min-height:100vh; padding:20px 16px; }
.topbar { display:flex; align-items:center; gap:10px; margin-bottom:24px; }
.topbar a { color:var(--muted); text-decoration:none; font-size:20px; }
.topbar h1 { font-size:18px; font-weight:800; }
.brand { text-align:center; margin-bottom:20px; }
.brand .logo { font-size:34px; }
.brand h2 { font-size:22px; font-weight:900; margin-top:6px; } .brand h2 span { color:var(--gold); }
.brand p { font-size:12px; color:var(--muted); margin-top:4px; }
.card { background:var(--card-bg); border-radius:20px; padding:20px 18px; box-shadow:0 8px 24px rgba(0,0,0,.5); }
.toggle { display:flex; background:#1e1e1e; border-radius:30px; padding:3px; margin-bottom:16px; }
.toggle button { flex:1; background:transparent; border:none; padding:10px; color:var(--muted); font-weight:700; font-size:13px; border-radius:24px; cursor:pointer; }
.toggle button.active { background:var(--primary); color:#fff; }
.input { width:100%; background:#1e1e1e; border:1px solid #333; border-radius:10px; padding:12px 14px; color:#fff; font-size:13px; margin-bottom:10px; outline:none; }
.input:focus { border-color:var(--primary); }
.error { color:#ef4444; font-size:12px; margin-bottom:8px; display:none; } .error.show { display:block; }
.success { color:#07c160; font-size:12px; margin-bottom:8px; display:none; } .success.show { display:block; }
.submit { background:linear-gradient(135deg,var(--primary),var(--primary-light)); border:none; width:100%; padding:13px; border-radius:40px; font-weight:800; font-size:14px; color:#fff; cursor:pointer; margin-top:6px; }
.submit:active { transform:scale(.97); }
.social-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:16px; }
.social-grid a { padding:10px; text-align:center; border-radius:10px; text-decoration:none; font-size:12px; font-weight:600; color:#fff; }
.google{background:#ea4335}.facebook{background:#1877f2}.instagram{background:#e1306c}.wechat{background:#07c160}
.whatsapp{background:#25d366;grid-column:span 2}
.note { margin-top:20px; font-size:11px; color:#777; text-align:center; line-height:1.6; }
</style>
</head>
<body>
<div class="topbar"><a href="/">←</a><h1>Account</h1></div>
<div class="brand"><div class="logo">✈️</div><h2>FlyTrip<span>Visa</span></h2><p>Your gateway to visas, flights, hotels & eSIM</p></div>
<div class="card">
  <div class="toggle">
    <button id="tabLogin" class="active">Login</button>
    <button id="tabSignup">Sign Up</button>
  </div>
  <div class="error" id="err"></div>
  <div class="success" id="ok"></div>
  <div id="nameField" style="display:none">
    <input type="text" id="name" class="input" placeholder="Full Name">
  </div>
  <input type="email" id="email" class="input" placeholder="Email Address">
  <input type="password" id="password" class="input" placeholder="Password (min 8 chars)">
  <button id="submitBtn" class="submit">🚀 Login to Account</button>
  <div class="social-grid">
    <a href="#" class="google">Google</a><a href="#" class="facebook">Facebook</a>
    <a href="#" class="instagram">Instagram</a><a href="#" class="wechat">WeChat</a>
    <a href="https://wa.me/message/SD44CN7CQKC7K1" target="_blank" rel="noopener" class="whatsapp">WhatsApp Connect</a>
  </div>
</div>
<div class="note">Processed Visas & Bookings: 12,500+ · Verified Global Partners: 1,200+<br>© 2026 FlyTripVisa.site</div>
<script>
let mode = 'login';
const tabLogin = document.getElementById('tabLogin');
const tabSignup = document.getElementById('tabSignup');
const nameField = document.getElementById('nameField');
const submitBtn = document.getElementById('submitBtn');
const err = document.getElementById('err');
const ok = document.getElementById('ok');

function setMode(m) {
  mode = m;
  tabLogin.classList.toggle('active', m === 'login');
  tabSignup.classList.toggle('active', m === 'signup');
  nameField.style.display = m === 'signup' ? 'block' : 'none';
  submitBtn.textContent = m === 'signup' ? '🚀 Create Account' : '🚀 Login to Account';
  err.classList.remove('show'); ok.classList.remove('show');
}
tabLogin.addEventListener('click', () => setMode('login'));
tabSignup.addEventListener('click', () => setMode('signup'));

submitBtn.addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const name = document.getElementById('name').value.trim();
  err.classList.remove('show'); ok.classList.remove('show');
  if (!email || !password) { err.textContent = 'Please fill in all required fields.'; err.classList.add('show'); return; }
  submitBtn.disabled = true;
  try {
    const res = await fetch('/api/' + mode, {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify(mode === 'signup' ? { email, password, name } : { email, password }),
    });
    const data = await res.json();
    if (data.ok) {
      localStorage.setItem('flytrip_user', JSON.stringify(data.data));
      ok.textContent = (mode === 'signup' ? 'Account created! ' : 'Welcome back! ') + '✅';
      ok.classList.add('show');
      setTimeout(() => window.location.href = '/', 900);
    } else {
      err.textContent = data.error || 'Authentication failed.'; err.classList.add('show');
    }
  } catch {
    err.textContent = 'Network error. Please try again.'; err.classList.add('show');
  } finally { submitBtn.disabled = false; }
});
</script>
</body>
</html>
